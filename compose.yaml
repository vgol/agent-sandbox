services:
  hermes:
    build: .
    image: agent-sandbox-hermes:local
    restart: unless-stopped
    ports:
      - "${HERMES_BIND_ADDRESS:-127.0.0.1}:${HERMES_PORT:-8642}:8642"
    environment:
      API_SERVER_KEY: ${API_SERVER_KEY:?Set API_SERVER_KEY to a random secret of at least 8 characters}
    volumes:
      - hermes-data:/opt/data

volumes:
  hermes-data:
